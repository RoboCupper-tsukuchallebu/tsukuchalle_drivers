# Run from the directory holding this file (scripts/deploy.sh puts it in ~/ddt-can-bridge/ with config/).
# DDT_SERIAL_DEVICE (required): host path of the board, /dev/serial/by-id/usb-... (not /dev/ttyACM0, which can change on replug).
# DDT_IMAGE_TAG: image tag, default latest.
# .env (optional, see README): TSUKUCHALLE_UID / TSUKUCHALLE_GID (default 1000: the login user of the robot PC),
# TSUKUCHALLE_DIALOUT_GID (20) and TSUKUCHALLE_INPUT_GID (995 = X13; other PCs: getent group dialout input).
# Every ROS process on the host must have one uid (shared-memory files are owner-only): see README.
x-ros-common: &ros-common
  image: ddt-can-bridge-ros2:${DDT_IMAGE_TAG:-latest}
  network_mode: host
  # Fast DDS shared memory between processes on one host does not cross containers unless they
  # share the IPC namespace. All ROS containers also share the host PID namespace.
  # The Fast DDS settings (XML, SYSTEM_DEFAULT) are the image's ENV.
  ipc: host
  pid: host
  # Numeric ids: the image has no user of this uid, and group_add needs ids that exist on the host.
  # /dds_check.sh stops the container when `id -u` differs from TSUKUCHALLE_UID.
  user: "${TSUKUCHALLE_UID:-1000}:${TSUKUCHALLE_GID:-1000}"
  init: true
  restart: "no"
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    TSUKUCHALLE_UID: ${TSUKUCHALLE_UID:-1000}
    # lan = look from a Mac: /dds_check.sh drops the Fast DDS profile and SYSTEM_DEFAULT (README).
    TSUKUCHALLE_DDS_MODE: ${TSUKUCHALLE_DDS_MODE:-}

services:
  # Starts with the motors disabled. Enable by hand: see README.
  drive:
    <<: *ros-common
    # /dev is mounted whole so the board is seen again after USB re-enumeration;
    # 166 is the ttyACM major number. devices: would be fixed at container creation.
    # DDT_SERIAL_DEVICE is required: with /dev visible, auto-detection would pick up
    # every CDC device on the host.
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 166:* rmw"
    # /dev/ttyACM* is root:dialout 0660 (udev rule), and user: is not root.
    group_add:
      - "${TSUKUCHALLE_DIALOUT_GID:-20}"
    command:
      - /ws/install/ddt_diff_drive/lib/ddt_diff_drive/diff_drive_node
      - --ros-args
      - --params-file
      - /ws/install/ddt_diff_drive/share/ddt_diff_drive/config/diff_drive.yaml
      - -p
      - "port:=${DDT_SERIAL_DEVICE:?set DDT_SERIAL_DEVICE to /dev/serial/by-id/usb-...}"
      - -r
      - cmd_vel:=/cmd_vel_mux

  # Moves only while enable_button is held. Swap the mapping by editing config/teleop_twist_joy.yaml.
  teleop:
    <<: *ros-common
    command:
      - /opt/ros/jazzy/lib/teleop_twist_joy/teleop_node
      - --ros-args
      - --params-file
      - /config/teleop_twist_joy.yaml
      - -r
      - cmd_vel:=/cmd_vel_teleop
    volumes:
      - ./config/teleop_twist_joy.yaml:/config/teleop_twist_joy.yaml:ro

  # Arbitrate manual and navigation commands before they reach the drive.
  mux:
    <<: *ros-common
    command:
      - /opt/ros/jazzy/lib/twist_mux/twist_mux
      - --ros-args
      - --params-file
      - /config/twist_mux.yaml
      - -r
      - cmd_vel_out:=/cmd_vel_mux
    volumes:
      - ./config/twist_mux.yaml:/config/twist_mux.yaml:ro

  # Joystick to /joy. /dev/input is mounted whole so a pad plugged in later is seen; 13 is the input major number.
  joy:
    <<: *ros-common
    command:
      - /opt/ros/jazzy/lib/joy/joy_node
      - --ros-args
      - -p
      - autorepeat_rate:=20.0
      - -p
      - deadzone:=0.1
    volumes:
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - "c 13:* rmw"
    # /dev/input/event* is root:input 0660. The input GID is not fixed across PCs (995 on X13).
    group_add:
      - "${TSUKUCHALLE_INPUT_GID:-995}"

  # Keyboard fallback: docker compose run --rm teleop-keyboard
  teleop-keyboard:
    <<: *ros-common
    profiles: [keyboard]
    stdin_open: true
    tty: true
    command: ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r cmd_vel:=/cmd_vel_teleop

  # Battery of the robot PC to /diagnostics ("host: battery", 1 Hz). Read-only: it reads sysfs and publishes
  # /diagnostics, and touches no drive topic. Same image as drive (ddt-can-bridge-ros2).
  host_monitor:
    <<: *ros-common
    # The container's own /sys already shows the host's power supplies; the explicit read-only mount keeps
    # that true even if /sys is hidden. Its symlinks resolve through the container's /sys/devices.
    volumes:
      - /sys/class/power_supply:/sys/class/power_supply:ro
    command:
      - /ws/install/tsukuchalle_host_monitor/lib/tsukuchalle_host_monitor/host_monitor_node
      - --ros-args
      - --params-file
      - /ws/install/tsukuchalle_host_monitor/share/tsukuchalle_host_monitor/config/host_monitor.yaml

  # HDL-32E on the USB LAN (sensor 192.168.100.200 -> host 192.168.100.100, UDP 2368). Separate, minimal
  # image (ubuntu:noble + the two executables and their libraries; its only ENTRYPOINT is /dds_check.sh, no ros2 CLI):
  # deploy.sh ships whole images. For `ros2 topic hz` / bag use tsukuchalle-ros-tools (ros2/tools).
  # VELODYNE_IMAGE_TAG: image tag, default latest.
  # profiles: a plain `docker compose up -d` must not start these on a robot that only got the ddt image.
  velodyne-driver:
    <<: *ros-common
    profiles: [velodyne]
    image: tsukuchalle-velodyne:${VELODYNE_IMAGE_TAG:-latest}
    restart: on-failure     # no motor-safety reason to stay down
    command:
      - /opt/ros/jazzy/lib/velodyne_driver/velodyne_driver_node
      - --ros-args
      - -p
      - model:=32E
      - -p
      - rpm:=600.0
      - -p
      - frame_id:=velodyne
      - -p
      - device_ip:=192.168.100.200   # packets from any other source are dropped silently

  # velodyne_pointcloud_node is tsukuchalle_velodyne (ros2/velodyne/tsukuchalle_velodyne), not ros-drivers'
  # velodyne_transform_node. To use another calibration, mount it and change `calibration:=`.
  velodyne-transform:
    <<: *ros-common
    profiles: [velodyne]
    image: tsukuchalle-velodyne:${VELODYNE_IMAGE_TAG:-latest}
    restart: on-failure
    command:
      - /ws/install/tsukuchalle_velodyne/lib/tsukuchalle_velodyne/velodyne_pointcloud_node
      - --ros-args
      - -p
      - calibration:=/ws/install/tsukuchalle_velodyne/share/tsukuchalle_velodyne/config/32db.yaml
