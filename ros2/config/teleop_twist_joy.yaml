# Generic / Xbox-style pad. Check axis and button numbers with `ros2 topic echo /joy`.
# Speeds raised after the wheels-lifted test on 2026-11-06 (0.3 m/s, 1.0 rad/s before).
teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true  # deadman: moves only while this button is held
    # enable_button and the axes below must match joy_deadman_button and joy_neutral_axes in
    # ddt_diff_drive/config/diff_drive.yaml, which checks them before enabling by pad.
    enable_button: 0             # A
    axis_linear:
      x: 1                       # left stick, up/down
    scale_linear:
      x: 0.6                     # m/s at full stick
    axis_angular:
      yaw: 0                     # left stick, left/right
    scale_angular:
      yaw: 1.5                   # rad/s at full stick
    inverted_reverse: false
    publish_stamped_twist: false
