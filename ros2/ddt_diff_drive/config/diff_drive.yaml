diff_drive_node:
  ros__parameters:
    # Empty: use the only connected board. Port names change when replugged.
    port: ""

    # Geometry.
    wheel_radius_m: 0.0935  # From the catalog diameter of 187 mm. Measure under load.
    track_width_m: 0.26     # Measured on the robot 2026-11-06: 26 cm (13 cm from the rotation center to each wheel).

    # Wheel assignment. Check with the wheels lifted; cannot change while enabled.
    left_motor_id: 1
    left_sign: 1
    right_sign: -1

    # Limits. The motors are rated for 115 rpm; the firmware allows up to 210 rpm.
    max_wheel_rpm: 100.0
    max_acceleration_rpm_per_s: 100.0

    # Targets fall to zero when /cmd_vel is silent for this long.
    command_timeout_s: 0.5

    # Pad buttons on /joy (Logicool F310, XInput + SDL). Check with `ros2 topic echo /joy`.
    # Enable (Start) is refused while the deadman is held or a neutral axis is deflected;
    # disable (Back) always works. -1 on joy_enable_button turns off enabling by pad only.
    joy_enable_button: 7
    joy_disable_button: 6
    # Keep both in step with ros2/config/teleop_twist_joy.yaml: enable_button for the deadman,
    # axis_linear.x and axis_angular.yaw for the neutral axes. A mismatch silently disables
    # the check.
    joy_deadman_button: 0
    joy_neutral_axes: [0, 1]

    # After a USB disconnect the node reopens the board and, if the motors were enabled, enables
    # them again once the deadman is released and the sticks are centered. Gives up (stays
    # DISABLED) after this many seconds from the reconnect. Needs joy_node's autorepeat_rate > 0
    # (20 Hz in compose): with 0, no Joy arrives while idle and it always gives up.
    auto_reenable_wait_s: 10.0
